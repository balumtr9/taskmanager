<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Tasks</title>
<style>
  :root {
    --bg: #f6f5f3;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6f4f;
    --accent-soft: #e6f2ec;
    --locked: #c7ccd1;
    --danger: #b3441e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
  }
  .app {
    width: 100%;
    max-width: 1180px;
  }
  header {
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }

  .add-task-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    max-width: 640px;
  }
  .add-task-row input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 0.95rem;
    background: var(--card);
  }
  .add-task-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    padding: 11px 18px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-primary:hover { opacity: 0.92; }

  /* ---------- overall progress ---------- */
  .overview {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .overview-card {
    flex: 1 1 240px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .overview-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .overview-label .name {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .overview-label .stat {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .bar-track {
    height: 8px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  /* ---------- grid of task cards ---------- */
  .task-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    align-items: start;
  }

  .task-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
  }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .checkbox {
    margin-top: 2px;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 5px;
    border: 2px solid var(--accent);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }
  .checkbox.done { background: var(--accent); }
  .checkbox.done::after {
    content: "";
    width: 5px;
    height: 9px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .checkbox.locked {
    border-color: var(--locked);
    cursor: not-allowed;
  }
  .checkbox.locked::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--locked);
  }
  .checkbox.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .task-title-wrap { flex: 1; min-width: 0; }
  .task-title {
    font-size: 1rem;
    font-weight: 600;
    word-break: break-word;
  }
  .task-title.done { text-decoration: line-through; color: var(--muted); font-weight: 500; }

  .task-progress { margin: 10px 0 2px; }
  .task-progress-track {
    height: 6px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .task-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .progress-note {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 5px;
  }

  .task-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.danger:hover { background: #f7e6df; color: var(--danger); }

  .subtasks {
    margin: 10px 0 4px;
    padding-left: 14px;
    padding-right: 6px;
    border-left: 2px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 210px;
    overflow-y: auto;
  }
  .subtask-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
  }
  .sub-checkbox {
    margin-top: 2px;
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    border-radius: 4px;
    border: 2px solid var(--accent);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sub-checkbox.done { background: var(--accent); }
  .sub-checkbox.done::after {
    content: "";
    width: 4px;
    height: 8px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .sub-checkbox.locked {
    border-color: var(--locked);
    cursor: not-allowed;
  }
  .sub-label-num {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    margin-right: 2px;
  }
  .sub-title {
    font-size: 0.9rem;
    flex: 1;
    word-break: break-word;
  }
  .sub-title.done { text-decoration: line-through; color: var(--muted); }

  .add-sub-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .add-sub-row input {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 0.85rem;
  }
  .add-sub-row button {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 0.9rem;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .toolbar button {
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
  }
  .toolbar button:hover { color: var(--ink); background: var(--accent-soft); border-color: var(--accent-soft); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Step Tasks</h1>
    <p class="subtitle">Break a task into steps. Steps unlock in order, and a task can't be checked off until every step is done.</p>
  </header>

  <div class="add-task-row">
    <input type="text" id="newTaskInput" placeholder="Add a new task, e.g. Get ready" maxlength="200">
    <button class="btn-primary" id="addTaskBtn">Add task</button>
  </div>

  <div class="overview" id="overview">
    <div class="overview-card">
      <div class="overview-label">
        <span class="name">Tasks completed</span>
        <span class="stat" id="overviewTasksStat">0/0 · 0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="overviewTasksFill" style="width:0%"></div></div>
    </div>
    <div class="overview-card">
      <div class="overview-label">
        <span class="name">Steps completed</span>
        <span class="stat" id="overviewStepsStat">0/0 · 0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="overviewStepsFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="task-list" id="taskList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No tasks yet. Add one above to get started.</div>

  <div class="toolbar">
    <button id="exportBtn" title="Save your tasks to a file on your computer">Export tasks</button>
    <button id="importBtn" title="Load tasks from a previously exported file">Import tasks</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  /* ---------- state ---------- */
  // tasks = [{ id, title, done, subtasks: [{ id, title, done }] }]
  let tasks = [];
  let nextId = 1;
  const STORAGE_KEY = 'stepTasksData';

  const taskListEl = document.getElementById('taskList');
  const emptyStateEl = document.getElementById('emptyState');
  const overviewEl = document.getElementById('overview');
  const newTaskInput = document.getElementById('newTaskInput');

  function uid() { return nextId++; }

  function makeTask(title) {
    return { id: uid(), title: title.trim(), done: false, subtasks: [] };
  }
  function makeSubtask(title) {
    return { id: uid(), title: title.trim(), done: false };
  }

  /* ---------- derived helpers ---------- */
  function allSubtasksDone(task) {
    return task.subtasks.length === 0 || task.subtasks.every(s => s.done);
  }
  function firstUnlockedIndex(task) {
    // the index of the first subtask that is not yet done (i.e. next one that can be checked)
    for (let i = 0; i < task.subtasks.length; i++) {
      if (!task.subtasks[i].done) return i;
    }
    return task.subtasks.length; // all done
  }

  /* ---------- actions ---------- */
  function addTask(title) {
    if (!title || !title.trim()) return;
    tasks.push(makeTask(title));
    render();
  }

  function addSubtask(taskId, title) {
    if (!title || !title.trim()) return;
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.subtasks.push(makeSubtask(title));
    // adding a new step after the task was already completed reopens it
    if (task.done) task.done = false;
    render();
  }

  function deleteTask(taskId) {
    tasks = tasks.filter(t => t.id !== taskId);
    render();
  }

  function deleteSubtask(taskId, subId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.subtasks = task.subtasks.filter(s => s.id !== subId);
    if (task.done && !allSubtasksDone(task)) task.done = false;
    render();
  }

  function toggleTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;

    if (task.subtasks.length === 0) {
      task.done = !task.done;
      render();
      return;
    }

    if (task.done) {
      // always allow reopening a finished task
      task.done = false;
      render();
      return;
    }

    if (allSubtasksDone(task)) {
      task.done = true;
      render();
    } else {
      flashLocked(`task-${taskId}`);
      toast('Finish every step before checking off this task.');
    }
  }

  function toggleSubtask(taskId, subId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const idx = task.subtasks.findIndex(s => s.id === subId);
    if (idx === -1) return;
    const sub = task.subtasks[idx];

    if (!sub.done) {
      // can only check if everything before it is already done
      const priorDone = task.subtasks.slice(0, idx).every(s => s.done);
      if (!priorDone) {
        flashLocked(`sub-${taskId}-${subId}`);
        toast('Complete the previous step first.');
        return;
      }
      sub.done = true;
    } else {
      // unchecking a step un-checks it and every step after it,
      // to keep the order consistent
      for (let i = idx; i < task.subtasks.length; i++) {
        task.subtasks[i].done = false;
      }
      // task can no longer be considered done
      task.done = false;
    }
    render();
  }

  function flashLocked(domId) {
    requestAnimationFrame(() => {
      const el = document.getElementById(domId);
      if (!el) return;
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 350);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- persistence (this page runs as a normal hosted site, so
     localStorage is safe here and keeps your list saved between visits) ---------- */
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, nextId }));
    } catch (e) {
      // storage unavailable (e.g. private browsing) — silently skip
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.tasks)) return false;
      tasks = parsed.tasks;
      nextId = parsed.nextId || 1;
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- overall progress bars ---------- */
  function renderOverview() {
    overviewEl.style.display = tasks.length === 0 ? 'none' : 'flex';

    const totalTasks = tasks.length;
    const doneTasks = tasks.filter(t => t.done).length;
    let totalSubs = 0, doneSubs = 0;
    tasks.forEach(t => {
      totalSubs += t.subtasks.length;
      doneSubs += t.subtasks.filter(s => s.done).length;
    });

    const taskPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;
    const subPct = totalSubs ? Math.round((doneSubs / totalSubs) * 100) : 0;

    document.getElementById('overviewTasksFill').style.width = taskPct + '%';
    document.getElementById('overviewTasksStat').textContent = `${doneTasks}/${totalTasks} · ${taskPct}%`;
    document.getElementById('overviewStepsFill').style.width = subPct + '%';
    document.getElementById('overviewStepsStat').textContent = `${doneSubs}/${totalSubs} · ${subPct}%`;
  }

  /* ---------- rendering ---------- */
  function render() {
    saveState();
    renderOverview();
    taskListEl.innerHTML = '';
    emptyStateEl.style.display = tasks.length === 0 ? 'block' : 'none';

    tasks.forEach((task, tIdx) => {
      const card = document.createElement('div');
      card.className = 'task-card';

      const locked = task.subtasks.length > 0 && !task.done && !allSubtasksDone(task);
      const doneCount = task.subtasks.filter(s => s.done).length;

      const row = document.createElement('div');
      row.className = 'task-row';

      const cb = document.createElement('div');
      cb.id = `task-${task.id}`;
      cb.className = 'checkbox' + (task.done ? ' done' : '') + (locked ? ' locked' : '');
      cb.title = locked ? 'Complete all steps first' : (task.done ? 'Mark as not done' : 'Mark as done');
      cb.addEventListener('click', () => toggleTask(task.id));
      row.appendChild(cb);

      const titleWrap = document.createElement('div');
      titleWrap.className = 'task-title-wrap';

      const titleEl = document.createElement('div');
      titleEl.className = 'task-title' + (task.done ? ' done' : '');
      titleEl.textContent = `${tIdx + 1}. ${task.title}`;
      titleWrap.appendChild(titleEl);

      row.appendChild(titleWrap);

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', () => deleteTask(task.id));
      actions.appendChild(delBtn);
      row.appendChild(actions);

      card.appendChild(row);

      // per-task progress bar (based on % of its subtasks completed)
      if (task.subtasks.length > 0) {
        const subPct = Math.round((doneCount / task.subtasks.length) * 100);

        const progWrap = document.createElement('div');
        progWrap.className = 'task-progress';

        const track = document.createElement('div');
        track.className = 'task-progress-track';
        const fill = document.createElement('div');
        fill.className = 'task-progress-fill';
        fill.style.width = subPct + '%';
        track.appendChild(fill);
        progWrap.appendChild(track);

        const note = document.createElement('div');
        note.className = 'progress-note';
        note.textContent = task.done
          ? 'All steps complete'
          : `${doneCount} of ${task.subtasks.length} steps complete (${subPct}%)`;
        progWrap.appendChild(note);

        card.appendChild(progWrap);
      }

      // subtasks (scrollable once the list gets long)
      if (task.subtasks.length > 0) {
        const subWrap = document.createElement('div');
        subWrap.className = 'subtasks';
        const unlockedIdx = firstUnlockedIndex(task);

        task.subtasks.forEach((sub, sIdx) => {
          const subRow = document.createElement('div');
          subRow.className = 'subtask-row';

          const subLocked = !sub.done && sIdx > unlockedIdx;
          const subCb = document.createElement('div');
          subCb.id = `sub-${task.id}-${sub.id}`;
          subCb.className = 'sub-checkbox' + (sub.done ? ' done' : '') + (subLocked ? ' locked' : '');
          subCb.title = subLocked ? 'Complete the previous step first' : (sub.done ? 'Mark as not done' : 'Mark as done');
          subCb.addEventListener('click', () => toggleSubtask(task.id, sub.id));
          subRow.appendChild(subCb);

          const num = document.createElement('span');
          num.className = 'sub-label-num';
          num.textContent = `${tIdx + 1}.${sIdx + 1}`;
          subRow.appendChild(num);

          const subTitle = document.createElement('span');
          subTitle.className = 'sub-title' + (sub.done ? ' done' : '');
          subTitle.textContent = sub.title;
          subRow.appendChild(subTitle);

          const subDel = document.createElement('button');
          subDel.className = 'icon-btn danger';
          subDel.textContent = '✕';
          subDel.title = 'Delete step';
          subDel.addEventListener('click', () => deleteSubtask(task.id, sub.id));
          subRow.appendChild(subDel);

          subWrap.appendChild(subRow);
        });

        card.appendChild(subWrap);
      }

      // add-subtask row
      const addSubRow = document.createElement('div');
      addSubRow.className = 'add-sub-row';
      const subInput = document.createElement('input');
      subInput.type = 'text';
      subInput.placeholder = 'Add a step…';
      subInput.maxLength = 160;
      const subAddBtn = document.createElement('button');
      subAddBtn.textContent = 'Add step';
      function submitSub() {
        addSubtask(task.id, subInput.value);
        subInput.value = '';
        subInput.focus();
      }
      subAddBtn.addEventListener('click', submitSub);
      subInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitSub(); });
      addSubRow.appendChild(subInput);
      addSubRow.appendChild(subAddBtn);
      card.appendChild(addSubRow);

      taskListEl.appendChild(card);
    });
  }

  /* ---------- import / export ---------- */
  function exportTasks() {
    const data = JSON.stringify({ tasks, nextId }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `step-tasks-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Tasks exported.');
  }

  function importTasks(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.tasks)) throw new Error('bad format');
        tasks = parsed.tasks;
        nextId = parsed.nextId || (Math.max(0, ...tasks.flatMap(t => [t.id, ...t.subtasks.map(s => s.id)])) + 1);
        render();
        toast('Tasks imported.');
      } catch (e) {
        toast('Could not read that file.');
      }
    };
    reader.readAsText(file);
  }

  /* ---------- wire up ---------- */
  document.getElementById('addTaskBtn').addEventListener('click', () => {
    addTask(newTaskInput.value);
    newTaskInput.value = '';
    newTaskInput.focus();
  });
  newTaskInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      addTask(newTaskInput.value);
      newTaskInput.value = '';
    }
  });

  document.getElementById('exportBtn').addEventListener('click', exportTasks);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    if (e.target.files[0]) importTasks(e.target.files[0]);
    e.target.value = '';
  });

  /* ---------- seed example (only if nothing saved yet) ---------- */
  const restored = loadState();
  if (!restored) {
    const seed = makeTask('Get ready');
    seed.subtasks = [makeSubtask('Take a shower'), makeSubtask('Dry my hair'), makeSubtask('Iron my clothes')];
    tasks.push(seed);
  }

  render();
})();
</script>
</body>
</html>
